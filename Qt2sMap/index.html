<html>
    <head>
        <meta name="viewport"/>
        <meta http-equiv="content-type" content="text/html; charset=utf-8" />
        <script type="text/javascript" src="https://www.google.com/jsapi"></script>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.2.0/jquery.min.js"></script>
        <script type="text/javascript" src="http://scdev5.qcri.org/sabbar/libs/jqcloud/jqcloud-1.0.2.js"></script>

        <link rel="stylesheet" type="text/css" href="css/qt2sMap.css" />
        <link rel="stylesheet" type="text/css" href="http://scdev5.qcri.org/sabbar/libs/jqcloud/jqcloud.css" />

        <script type="text/javascript" src="https://www.google.com/jsapi"></script>
        <script type="text/javascript" src="https://maps.google.com/maps/api/js?sensor=false&amp;v=3&amp;key=AIzaSyDfrDYNYM5wC-qsdOUPygV8ws4PQUKBzlc"></script>
        <script type="text/javascript" src="js/oms.min.js"></script>

        <script type="text/javascript">
            var lastDate;
            var gm = google.maps;
            var oms;
            var map;
            var markers = [];
            var infowindow = new gm.InfoWindow();
            var tweet_categorizes = [{"name":"Accident", "color": "color red", "color_code": "C00"}, {"name":"Road_Construction", "color": "color yellow", "color_code": "FF3"}, {"name":"Weather_Condition", "color": "color green", "color_code": "337F00"}, {"name":"Road_Diversion", "color": "color blue", "color_code": "06C"}, {"name":"Procession", "color": "color purple", "color_code": "63C"}, {"name":"Others", "color": "color gray", "color_code": "989898"}];
            //
            function initialize() {
                //
                gm.visualRefresh = true;
                var isMobile = (navigator.userAgent.toLowerCase().indexOf('android') > -1) ||
                    (navigator.userAgent.match(/(iPod|iPhone|iPad|BlackBerry|Windows Phone|iemobile)/));
                if (isMobile) {
                    var viewport = document.querySelector("meta[name=viewport]");
                    viewport.setAttribute('content', 'initial-scale=1.0, user-scalable=no');
                }
                //var mapDiv = document.getElementById('maps_content');
                //mapDiv.style.width = isMobile ? '100%' : '1000px';
                //mapDiv.style.height = isMobile ? '100%' : '490px';
                map = new gm.Map(document.getElementById('maps_content'), {
                    center: new gm.LatLng(25.3417949, 51.4600856),
                    zoom: 11,
                    mapTypeId: gm.MapTypeId.ROADMAP
                });

                oms = new OverlappingMarkerSpiderfier(map, {markersWontMove: true, markersWontHide: true});

                // add legend to map
                map.controls[gm.ControlPosition.LEFT_BOTTOM].push(document.getElementById('legend'));
                var legend = document.getElementById('legend');
                for (var i=0; i<tweet_categorizes.length; i++) {
                    var name = tweet_categorizes[i].name;
                    var color = tweet_categorizes[i].color;
                    var div = document.createElement('div');
                    div.innerHTML = '<div class="'+color+'"></div>'+name;
                    legend.appendChild(div);
                }

                // Adding Traffic Layer!
                var trafficLayer = new gm.TrafficLayer();
                trafficLayer.setMap(map);

                if (isMobile) {
                    var legend = document.getElementById('googft-legend');
                    var legendOpenButton = document.getElementById('googft-legend-open');
                    var legendCloseButton = document.getElementById('googft-legend-close');
                    legend.style.display = 'none';
                    legendOpenButton.style.display = 'block';
                    legendCloseButton.style.display = 'block';
                    legendOpenButton.onclick = function() {
                        legend.style.display = 'block';
                        legendOpenButton.style.display = 'none';
                    }
                    legendCloseButton.onclick = function() {
                        legend.style.display = 'none';
                        legendOpenButton.style.display = 'block';
                    }
                }

                // read real time data from QT2S API
                var api_key = 'hTy5Wt1A7VQ9Ctce8vgRLw6bj43axHU5d5vcvzIFaq0';  // Noora's production key
                var data_count = 100;
                $.ajax({
                    type: "GET",
                    url: "http://qt2s.qcri.org/api/v1/tweets/recent?count="+data_count+"&key="+api_key,
                    success: function(alldata) {
                        processJSONData(alldata);
                    },
                    error: function(xhr) {
                        console.log('URL Error');
                    }
                });

                setInterval(function() {
                    console.log('lastDate: '+this.lastDate);
                    var currentMonth = ("0"+ (this.lastDate.getMonth()+1)).slice(-2);
                    var currentDay = ("0"+ this.lastDate.getDate()).slice(-2);
                    var currentHour = ("0"+this.lastDate.getHours()).slice(-2);
                    var currentMin = ("0"+this.lastDate.getMinutes()).slice(-2);
                    var currentSec = ("0"+this.lastDate.getSeconds()).slice(-2);
                    var since_date = this.lastDate.getFullYear()+"-"+currentMonth+"-"+currentDay+"T"+currentHour+":"+currentMin+":"+currentSec;
                    //console.log(since_date);
                    $.ajax({
                        type: "GET",
                        url: "http://qt2s.qcri.org/api/v1/tweets/search?q=a&since="+since_date+"&key="+api_key,
                        success: function(alldata) {
                            processJSONData(alldata);
                        },
                        error: function(xhr) {
                            console.log('URL Error');
                        }
                    });
                }, 1000 * 60 * 3); // call API every 3 minutes
            }

            function processJSONData(alldata) {
                //console.log('process json data');
                //console.log('alldata length: '+alldata.res.length);
                var newItems = false;
                //console.log(newItems);
                for (var i=0; i<alldata.res.length; i++) {
                    if(alldata.res[i] != '') {
                        var obj = alldata.res[i];
                        if (this.lastDate != null) {
                            //console.log(obj.tweet_timestamp);
                            var currentDate = new Date(parseInt(obj.tweet_timestamp));
                            if (currentDate > this.lastDate) {
                                this.lastDate = currentDate;
                                //console.log('update lastDate to: '+this.lastDate);
                                newItems = true;
                                checkObjCoordinates(obj);
                            }
                        }
                        else { // first time
                            newItems = true;
                            checkObjCoordinates(obj);
                        }
                    }
                }
                //
                if (this.lastDate == null) { //first time
                    //console.log('first time, lastDate: '+this.lastDate);
                    var lastObjTest = alldata.res[alldata.res.length-1];
                    var lastObj;
                    if(lastObjTest == '') {
                        lastObj = alldata.res[alldata.res.length-2];
                    } else {
                        lastObj = alldata.res[alldata.res.length-1];
                    }
                    //console.log(lastObj.tweet_timestamp);
                    this.lastDate = new Date(parseInt(lastObj.tweet_timestamp));
                    //console.log('lastDate: '+this.lastDate);
                }
                //console.log('markers length '+markers.length);
                //console.log('done json process data');
                //
                if(newItems === true) {
                    var shadow = new gm.MarkerImage(
                        'https://www.google.com/intl/en_ALL/mapfiles/shadow50.png',
                        new gm.Size(37, 34),  // size   - for sprite clipping
                        new gm.Point(0, 0),   // origin - ditto
                        new gm.Point(10, 34)  // anchor - where to meet map location
                    );
                    oms.addListener('click', function(marker) {
                        infowindow.setContent(marker.desc);
                        infowindow.open(map, marker);
                    });
                    oms.addListener('spiderfy', function(markers) {
                        for(var i = 0; i < markers.length; i ++) {
                            markers[i].setShadow(null);
                        }
                    });
                    oms.addListener('unspiderfy', function(markers) {
                        for(var i = 0; i < markers.length; i ++) {
                            markers[i].setShadow(shadow);
                        }
                    });
                }
            }
            //
            gm.event.addDomListener(window, 'load', initialize);
            //
            function checkObjCoordinates(obj) {
                var lat = null;
                var lng = null;
                var pictures = obj.images;
                var marker_color = null;
                var marker_size = null;
                var tweet_coordinates = obj.tweet_coordinates;
                //
                var category_name = null;
                // get tweet category from returned data
                category_name = obj.category;
                if(category_name == null)
                    category_name = 'Others';
                var obj_category = getCategory(category_name);
                //
                var is_geolocated = false;
                //
                broken = obj_category.color.split(' ');
                marker_color = broken[1];
                //
                if (tweet_coordinates != null) { //geolocated tweet
                    lat = tweet_coordinates.lat;
                    lng = tweet_coordinates.lng;
                    is_geolocated = true;
                }
                else {
                    for (var j=0; j<obj.traffic_locations.length; j++) {
                        var loc = obj.traffic_locations[j];
                        var coor = loc.coordinates;
                        if (coor != null) {
                            if (coor.google != null) {
                                lat = coor.google.lat;
                                lng = coor.google.lng;
                            }
                            else {
                                if (coor.nominatim != null) {
                                    lat = coor.nominatim.lat;
                                    lng = coor.nominatim.lng;
                                }
                                else {
                                    if (coor.bing != null) {
                                        lat = coor.bing.lat;
                                        lng = coor.bing.lng;
                                    }
                                }
                            }
                        }
                    }
                }

                if(lat != null && lng != null) {
                    var windowContent;
                    if(pictures != null) {
                        marker_size = 'large';
                        windowContent = "<div> <span style='font-weight:bold;'>" + obj.user_screen_name+ "</span></br>" + obj.tweet_text + "</br><i>" + new Date(parseInt(obj.tweet_timestamp)) +"</i></br><img src="+pictures[0]+" style=\"width:304px;height:228px;\"> </div>";
                    }
                    else {
                        marker_size = 'small';
                        windowContent = "<div> <span style='font-weight:bold;'>" + obj.user_screen_name+ "</span></br>" + obj.tweet_text + "</br><i>" + new Date(parseInt(obj.tweet_timestamp)) + "</i></div>";
                    }
                    //
                    createMarker(lat, lng, windowContent, marker_size, marker_color, obj_category.color_code, is_geolocated);
                }
                //else {
                //    console.log(obj.tweet_id+': lat: '+lat+', lng: '+lng);
                //}
            }

            function getCategory(categoryName) {
                for(var i=0; i<tweet_categorizes.length; i++) {
                    if(tweet_categorizes[i].name == categoryName) {
                        return tweet_categorizes[i];
                    }
                }
            }
            //
            // This function create marker with color, size and infoWindow
            function createMarker(lat, lng, htmlInfoWindow, marker_size, marker_color, color_code, is_geolocated) {
                var marker = null;
                var latLng = new gm.LatLng(lat, lng);
                var large_icon_path = null;
                var small_icon_path = null;
                var icon_scale = 0;
                var pin_image = null;
                //
                if(is_geolocated) {
                    large_icon_path = "http://chart.apis.google.com/chart?chst=d_map_xpin_icon&chld=pin_star|location|";
                    pin_image = new gm.MarkerImage(large_icon_path + color_code+"|FF0000");
                    small_icon_path = gm.SymbolPath.BACKWARD_CLOSED_ARROW;
                    icon_scale = 3;
                }
                else {
                    large_icon_path = "http://chart.apis.google.com/chart?chst=d_map_pin_letter&chld=%E2%80%A2|";
                    pin_image = new gm.MarkerImage(large_icon_path + color_code,
                        new gm.Size(21, 34),
                        new gm.Point(0,0),
                        new gm.Point(10, 34));
                    small_icon_path = gm.SymbolPath.CIRCLE;
                    icon_scale = 5;
                }

                if(marker_size == 'large') {
                    marker = new gm.Marker({
                        position: latLng,
                        icon: pin_image,
                        map: map,
                        animation: gm.Animation.DROP
                    });
                }
                else if(marker_size == 'small') {
                    marker = new gm.Marker({
                        position: latLng,
                        icon: {
                             path: small_icon_path,
                             strokeColor: marker_color,
                             scale: icon_scale
                        },
                        map: map,
                        animation: gm.Animation.DROP
                    });
                }
                marker.desc = htmlInfoWindow;
                oms.addMarker(marker);
                markers.push(marker);

                //Pans map to the new location of the marker
                map.panTo(latLng);
            }

        </script>

        <!-- load Google Annotated Timeline-->
        <script type='text/javascript' src='https://www.gstatic.com/charts/loader.js'></script>
        <script type='text/javascript'>
            google.charts.load('current', {'packages':['annotatedtimeline']});
            google.charts.setOnLoadCallback(load_chart_data);
            var records = [];
            function load_chart_data() {
                records = [];
                $.ajax({
                    type: "GET",
                    url: "report.txt",
                    dataType: "text",
                    success: function(data) {
                        processReportDate(data);
                        drawChart();
                    }
                });
                //
                setInterval(function() {
                    console.log('slept 1 hour');
                    records = [];
                    $.ajax({
                        type: "GET",
                        url: "report.txt",
                        dataType: "text",
                        success: function(data) {
                            processReportDate(data);
                            drawChart();
                        }
                    });
                }, 1000 * 60 * 60); // read report every 1 hour
            }
            //
            function processReportDate(allText) {
                console.log('process data');
                var lines = allText.split('\n');
                if (lines[lines.length-1] == '') {
                    lines.splice(lines.length-1, 1);
                }
                records = lines;
            }
            //
            function drawChart() {
                console.log('draw chart');
                //
                var rows = [];
                for(var i=0; i<records.length; i++){
                    var record = records[i];
                    var broken = record.split(',');
                    var dateString = broken[0];
                    var currentDate = new Date(dateString);
                    var current_dur = null;
                    var pre_dur = null;
                    var avg_dur = null;
                    if (broken[1] != "")
                        current_dur = Number(broken[1]);
                    if (broken[2] != "")
                        pre_dur = Number(broken[2]);
                    if(broken[3] != "")
                        avg_dur = Number(broken[3]);
                    //
                    //console.log(current_dur+', '+pre_dur+', '+avg_dur);
                    var rows_details = [];
                    rows_details.push(currentDate);
                    rows_details.push(current_dur);
                    rows_details.push(undefined);
                    rows_details.push(undefined);
                    //
                    rows_details.push(pre_dur);
                    rows_details.push(undefined);
                    rows_details.push(undefined);
                    //
                    rows_details.push(avg_dur);
                    rows_details.push(undefined);
                    rows_details.push(undefined);
                    rows.push(rows_details);
                }
                var data = new google.visualization.DataTable();
                //columns: date+hour, duration-this-week, describtion-optional, additional decsribtion-optional,duration-pre-week, describtion-optional, additional decsribtion-optional, duration-avg-week, describtion-optional, additional decsribtion-optional
                data.addColumn('date', 'Date');
                data.addColumn('number', 'current week');
                data.addColumn('string', 'title');
                data.addColumn('string', 'text');
                data.addColumn('number', 'previous week');
                data.addColumn('string', 'title2');
                data.addColumn('string', 'text2');
                data.addColumn('number', 'avg-week');
                data.addColumn('string', 'title3');
                data.addColumn('string', 'text3');
                //
                data.addRows(rows);
                //
                var chart = new google.visualization.AnnotatedTimeLine(document.getElementById('graph_content'));
                chart.draw(data, {displayAnnotations: true, thickness:2, scaleType:'maximized'});
          }
    </script>
   </head>
    <body>

            <div id="header" >
                <div style="height:240px;width:100%;"></div><h1>STM: Social Traffic Monitoring</h1>
            </div>

            <div id="container">
                <div id="inputs">
                    <div class="boxTitle">  Inputs</div>
                    <div id="inputs_content">
                        Data Sources:
                        <input type="checkbox" name="data_source" value="iTraffic"> waveTraff
