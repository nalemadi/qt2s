<script type="text/javascript" src="https://maps.google.com/maps/api/js?sensor=false&amp;v=3"></script>

<script type="text/javascript">
  function initialize() {
    google.maps.visualRefresh = true;
    var isMobile = (navigator.userAgent.toLowerCase().indexOf('android') > -1) ||
      (navigator.userAgent.match(/(iPod|iPhone|iPad|BlackBerry|Windows Phone|iemobile)/));
    if (isMobile) {
      var viewport = document.querySelector("meta[name=viewport]");
      viewport.setAttribute('content', 'initial-scale=1.0, user-scalable=no');
    }
     var mapDiv = document.getElementById('maps_content');
    mapDiv.style.width = isMobile ? '100%' : '1000px';
    mapDiv.style.height = isMobile ? '100%' : '490px';
    var map = new google.maps.Map(mapDiv, {
      center: new google.maps.LatLng(52.34616512555606, 15.81693150000001),
      zoom: 2,
      mapTypeId: google.maps.MapTypeId.ROADMAP
    });

    layer = new google.maps.FusionTablesLayer({
      map: map,
      heatmap: { enabled: false },
      query: {
        select: "col3",
        from: map_table,
        where: ""
      },
      options: {
        styleId: 2,
        templateId: 2
      }
    });

    if (isMobile) {
      var legend = document.getElementById('googft-legend');
      var legendOpenButton = document.getElementById('googft-legend-open');
      var legendCloseButton = document.getElementById('googft-legend-close');
      legend.style.display = 'none';
      legendOpenButton.style.display = 'block';
      legendCloseButton.style.display = 'block';
      legendOpenButton.onclick = function() {
        legend.style.display = 'block';
        legendOpenButton.style.display = 'none';
      }
      legendCloseButton.onclick = function() {
        legend.style.display = 'none';
        legendOpenButton.style.display = 'block';
      }
    }
  }

  google.maps.event.addDomListener(window, 'load', initialize);
</script>

<script type="text/javascript">
$.ajax({
        url:"https://www.googleapis.com/fusiontables/v2/query?sql=SELECT user, freq from "+ users_table +" order by freq DESC limit 50&key="+my_key,
        success: function(data){
		var r = new Array(), j = -1;
                $.each( data['rows'], function( key, val ){
     			r[++j] ='<tr><td><a href="http://twitter.com/'+val[0]+'" target=_blank>@'+ val[0]+ '</a></td>'+ '<td>'+ val[1]+' tweets</td></tr>';
        	});
		$('#users').html(r.join(''));
	}
});
</script>

<script type="text/javascript">
var word_list = [];
$.ajax({
	 url: "https://www.googleapis.com/fusiontables/v2/query?sql=SELECT hashtag, freq from "+ hashtags_table +" order by freq DESC limit 50&key="+my_key,
        success: function(data){
		var r = new Array(), j = -1;
                $.each( data['rows'], function( key, val ){
			// alert(val);
     			word_list.push(new word(val[0],val[1]));
        	});
		$("#pophashtags_content").jQCloud(word_list, {shape:'elliptical'});
		}
});
function word(content, weight){
	this.text=content;
	this.weight=weight;
}
</script>


<script type="text/javascript">
$.ajax({
	 url: "https://www.googleapis.com/fusiontables/v2/query?sql=SELECT url, name, screenname, text,freq from "+ tweets_table +" order by freq DESC limit 50&key="+my_key,
        success: function(data){
		var r = new Array(), j = -1;
                $.each( data['rows'], function( key, val ){
			r[++j] ='<tr><td><img src='+ val[0]+ '/></td><td><a href="http://www.twitter.com/'+val[2]+'" target=_blank>'+val[1]+'</a>:'+ val[3]+'</br>'+val[4]+' x Times</td></tr>';
        	});
		$('#popretweets').html(r.join(''));

	}
});
</script>
